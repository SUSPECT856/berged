name: BERGED OS

on:
  push:
  pull_request:

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build and VM tools
        run: sudo apt-get update && sudo apt-get install -y build-essential binutils qemu-system-x86
      - name: Build
        run: make
      - name: Structural checks
        run: make check
      - name: QEMU headless boot
        run: bash ./tools/boot-test.sh
      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: berged-os-serial-log
          path: qemu-serial.log
